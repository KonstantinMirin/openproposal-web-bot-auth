# Layer ban: the environment is read in one place per agent, its settings module.
#
# Run as its own stage: `uv run ruff check --config ruff-environment.toml` (make lint).
# A separate config, so that no exemption here leaks into another ban.
#
# Scope: every Python file this repository runs, except the vendored SDK.
extend-exclude = ["vendor"]

[lint]
select = ["TID251"]

[lint.per-file-ignores]
# Where Settings.from_env() lives: the one sanctioned reader per agent.
"*/settings.py" = ["TID251"]
# Exemptions (shrink-only). Each one reads the environment today, and Step 2 (the
# composition root and per-agent settings) removes it.
"seller/app.py" = ["TID251"]  # Step 2: seller/settings.py
"buyer/app.py" = ["TID251"]  # Step 2: buyer/settings.py
"shared/operator.py" = ["TID251"]  # Step 2: the operator key comes from settings
"shared/wba.py" = ["TID251"]  # Step 2: the CA bundle and cache age come from settings
"runner/live.py" = ["TID251"]  # Step 2: runner settings
"e2e/scenarios/conftest.py" = ["TID251"]  # Step 2: e2e/scenarios/settings.py
"e2e/scenarios/test_02_bearer.py" = ["TID251"]  # Step 2: e2e/scenarios/settings.py

[lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read the environment once, in the agent's Settings.from_env()."
"os.getenv".msg = "Read the environment once, in the agent's Settings.from_env()."
"os.environb".msg = "Read the environment once, in the agent's Settings.from_env()."
"os.getenvb".msg = "Read the environment once, in the agent's Settings.from_env()."
