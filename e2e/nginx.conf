# The TLS front: one listener on 443 for the three demo origins. It passes each
# request on unchanged (method, path, query, headers, and body), so the
# signatures still verify behind it. Origins carry no port.
events {}

http {
    ssl_certificate      /certs/front.pem;
    ssl_certificate_key  /certs/front.key;
    proxy_http_version   1.1;
    proxy_set_header     Host $host;
    proxy_buffering      off;
    client_max_body_size 1m;

    server {
        listen 443 ssl;
        server_name seller.wba-demo.noetis.dev;
        # The fault toggle is test-only and never public.
        location /test/ { return 404; }
        location / { proxy_pass http://seller:8000; }
    }

    server {
        listen 443 ssl;
        server_name buyer.wba-demo.noetis.dev;
        # The buyer's operator controls stay inside the network.
        location /operator/ { return 404; }
        # The library sends Cache-Control: max-age=300 on a directory and has no option
        # to change it. The stack's rotation waits are 20 s, so the front says max-age=0:
        # no cache may hold the directory, and the rotation wait is the seller's 20 s
        # max_cache_age alone. The header isn't covered by the directory's signatures.
        location = /.well-known/http-message-signatures-directory {
            proxy_pass http://buyer:8000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "max-age=0" always;
        }
        location / { proxy_pass http://buyer:8000; }
    }

    server {
        listen 443 ssl;
        server_name cfbot.wba-demo.noetis.dev;
        location /run/ { return 404; }
        location / { proxy_pass http://cfbot:8000; }
    }
}
