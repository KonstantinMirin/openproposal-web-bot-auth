# The TLS front: one listener on 443 for the three demo origins. It passes each
# request on unchanged (method, path, query, headers, and body), so the
# signatures still verify behind it. Origins carry no port.
events {}

http {
    ssl_certificate      /certs/front.pem;
    ssl_certificate_key  /certs/front.key;
    proxy_http_version   1.1;
    proxy_set_header     Host $host;
    proxy_buffering      off;
    client_max_body_size 1m;

    server {
        listen 443 ssl;
        server_name seller.wba-demo.noetis.dev;
        # The fault toggle is test-only and never public; the operator controls stay inside.
        location /test/ { return 404; }
        location /operator/ { return 404; }
        location / { proxy_pass http://seller:8000; }
    }

    server {
        listen 443 ssl;
        server_name buyer.wba-demo.noetis.dev;
        # The buyer's operator controls stay inside the network.
        location /operator/ { return 404; }
        location / { proxy_pass http://buyer:8000; }
    }

    server {
        listen 443 ssl;
        server_name cfbot.wba-demo.noetis.dev;
        location /run/ { return 404; }
        location / { proxy_pass http://cfbot:8000; }
    }
}
