# The demo stack. Run it with ./e2e/run-e2e.sh (or `make e2e`), which first
# writes e2e/generated/: the throwaway TLS material and secrets
# (gen_demo_tls.py), and the front's Caddyfile (deploy/local_caddy.py). It runs
# Compose with `--env-file generated/demo.env`, the secrets each service names.
#
# The services are deploy/compose.base.yml's; this file adds what the test
# needs: the demo CA in every trust store, the short timings, the test-only
# fault toggle, the TLS front, and the scenarios service. Every agent is
# reached at https://<name>.wba-demo.noetis.dev through the front, whose network
# aliases are those three names. The front is Caddy serving the production
# snippet (deploy/Caddyfile.snippet), so scenario 11 checks the routing policy
# that is deployed. No agent is configured with another's key.
name: wba-demo

# Timing, short so the rotation scenario stays short, and stated once: the agents
# that use each value and the scenario that waits on it read the same anchor.
# Production uses the library default, 300 s, for the cache age; serves max-age
# 300, waits 600 s (max-age 300 plus max_cache_age 300), and signs for 300 s.
x-cache-age: &cache-age
  # How long the seller answers from a cached buyer directory.
  WBA_MAX_CACHE_AGE: "20"
x-rotation: &rotation
  # No cache may hold the buyer's directory (max-age 0), so the rotation wait is
  # the seller's 20 s cache alone; short signatures too.
  WBA_ROTATION_WAIT: "20"
  WBA_SIGNATURE_LIFETIME: "10"

x-test: &test
  image: wba-demo-python:local
  healthcheck: { interval: 2s }

services:
  seller:
    extends: { file: ../deploy/compose.base.yml, service: seller }
    <<: *test
    environment:
      <<: *cache-age
      SSL_CERT_FILE: /certs/bundle.pem
      # TEST ONLY: mounts PUT /test/fault (seller/faults.py).
      DEMO_FAULT_INJECTION: "1"
    volumes:
      - ./generated/bundle.pem:/certs/bundle.pem:ro

  buyer:
    extends: { file: ../deploy/compose.base.yml, service: buyer }
    <<: *test
    environment:
      <<: *rotation
      SSL_CERT_FILE: /certs/bundle.pem
      WBA_DIRECTORY_MAX_AGE: "0"
    volumes:
      - ./generated/bundle.pem:/certs/bundle.pem:ro

  cfbot:
    extends: { file: ../deploy/compose.base.yml, service: cfbot }
    image: wba-demo-cfbot:local
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
    volumes:
      - ./generated/ca.pem:/certs/ca.pem:ro
    healthcheck: { interval: 2s }

  front:
    image: caddy:2.8-alpine
    volumes:
      - ./generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./generated/front.pem:/certs/front.pem:ro
      - ./generated/front.key:/certs/front.key:ro
      - ./generated/logs:/var/log/caddy
    networks:
      agents:
        aliases:
          - seller.wba-demo.noetis.dev
          - buyer.wba-demo.noetis.dev
          - cfbot.wba-demo.noetis.dev
    depends_on:
      seller: { condition: service_healthy }
      buyer: { condition: service_healthy }
      cfbot: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://seller.wba-demo.noetis.dev/health"]
      interval: 2s
      retries: 30

  # The e2e scenarios (pytest), not the live runner (runner/, deploy/): the image's
  # `scenarios` stage, the base plus e2e/scenarios and the dev group.
  scenarios:
    extends: { file: ../deploy/compose.base.yml, service: python }
    <<: *test
    image: wba-demo-python:scenarios
    build: { target: scenarios }
    profiles: !override [test]
    command: ["pytest", "-v", "-p", "no:cacheprovider", "e2e/scenarios"]
    environment:
      # The scenarios wait on the same timing the agents run with (test_10).
      <<: [*cache-age, *rotation]
      SSL_CERT_FILE: /certs/bundle.pem
      PEER_SELLER_ORIGIN: https://seller.wba-demo.noetis.dev
      PEER_BUYER_ORIGIN: https://buyer.wba-demo.noetis.dev
      PEER_CFBOT_ORIGIN: https://cfbot.wba-demo.noetis.dev
      # Each agent's own operator key, to reach its controls, and the bearer token.
      SELLER_OPERATOR_KEY: ${SELLER_OPERATOR_KEY:?}
      BUYER_OPERATOR_KEY: ${BUYER_OPERATOR_KEY:?}
      CFBOT_OPERATOR_KEY: ${CFBOT_OPERATOR_KEY:?}
      DEMO_BEARER_TOKEN: ${DEMO_BEARER_TOKEN:?}
    volumes:
      - ./generated/bundle.pem:/certs/bundle.pem:ro
      # Read-only: the scenarios inspect what each party stored, and sign with
      # the buyer's keys to send what the buyer never would.
      - seller-db:/seller-data:ro
      - buyer-db:/buyer-data:ro
      - buyer-keys:/buyer-keys:ro
    healthcheck: { disable: true }
    depends_on:
      front: { condition: service_healthy }

networks:
  agents: {}

volumes:
  seller-keys: {}
  seller-db: {}
  buyer-keys: {}
  buyer-db: {}
  cfbot-data: {}
