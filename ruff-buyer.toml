# Layer ban: in the buyer, only its seller client, its credentials, and its cfbot
# peer touch HTTP.
#
# Run as its own stage: `uv run ruff check --config ruff-buyer.toml` (make lint).
# A separate config, so that no exemption here leaks into another ban.
include = ["buyer/**/*.py"]

[lint]
select = ["TID251"]

[lint.per-file-ignores]
# The one client to a seller, which verifies and parses every answer.
"buyer/seller_client.py" = ["TID251"]
# The one factory of the auth of a call to a seller, which always verifies the answer.
"buyer/credentials.py" = ["TID251"]
# The one sign-only peer.
"buyer/cfbot.py" = ["TID251"]

[lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Only buyer/seller_client.py and buyer/cfbot.py send requests; call them."
