# The demo's gate: make quality on every push and pull request, and the whole
# demo stack (make e2e) beside it.
#
# Every job is a fresh clone of this repository alone, as a reader clones it: no
# sibling checkout and no token. The Web Bot Auth library installs from
# vendor/iab-agentic-primitives, pinned at the commit its VENDORED.md names, and
# the OpenProposal SDK from vendor/openproposal-sdk, both through uv.lock.
name: gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked dev group, the vendored library included
        run: uv sync --locked --group dev
      - name: make quality
        run: make quality

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: make e2e
        run: make e2e
      - name: make live-config
        run: make live-config
      # The production compose file, rehearsed: one live run, the routing policy, and
      # no agent key readable in the runner's container.
      - name: make live-local
        run: make live-local
