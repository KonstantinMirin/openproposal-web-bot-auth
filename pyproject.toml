[project]
name = "openproposal-web-bot-auth"
version = "0.1.0"
description = "Demo: bearer tokens and Web Bot Auth signatures as credentials at one identity boundary, in front of OpenProposal offer acceptance"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # The Web Bot Auth module: signing, verification, the key directory, fetches.
    "iab-agentic-primitives[wba]",
    # The generated OpenProposal types.
    "openproposal-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    # RFC 8785 canonical JSON, the record_digest input (OpenProposal § 4.1.1).
    "rfc8785>=0.1.4",
    # The Public Suffix List, read offline, for the attribution rule (§ 4.1.2).
    "tldextract>=5.1",
    "idna>=3.7,<4",
    # The YAML parser; protocol/documents.py applies the YAML 1.2 core schema § 4.1.1 names.
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.39",
    "import-linter>=2.1",
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.4",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
# A path dependency on the library checkout next to this repository. The same
# relative layout holds inside the Docker build (see Dockerfile and the wba-lib
# additional context in e2e/docker-compose.yml).
iab-agentic-primitives = { path = "../iab-agentic-primitives", editable = true }
openproposal-sdk = { path = "vendor/openproposal-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "persistence", "shared", "seller", "buyer", "runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The guard tests import their shared helper as tests._tools.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "C4", "UP", "C90", "PLR", "SIM", "RET", "PTH", "TRY",
    "ARG", "ANN", "S", "TID", "RUF100",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openproposal._runtime".msg = "Import the SDK's public names from openproposal."

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]
"e2e/scenarios/**" = ["S101", "PLR2004", "ANN"]
# Exemptions for production files. They only shrink: each line lists the exact
# codes today's tree reports in that file, and the step that removes them.
"runner/live.py" = ["ANN401", "PLR2004", "TRY003"]  # Step 7: runner/ split

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# The scope: the modules that pass strict today. Each step adds the modules it
# makes clean; Step 8 ends with every package, tests/, and e2e/. A module
# outside the scope is still analyzed for its callers, but reports nothing
# (the follow_imports override below). Out of scope today, by the step that
# brings it in:
#   Step 7: runner/live
#   Step 8: the rest of tests/, and e2e/
# tests/ has no __init__.py, so its modules are named from the repository root.
explicit_package_bases = true
files = [
    "seller/__init__.py",
    "seller/app.py",
    "seller/boundary.py",
    "seller/caller.py",
    "seller/errors.py",
    "seller/faults.py",
    "seller/http.py",
    "seller/offers/__init__.py",
    "seller/offers/acceptance.py",
    "seller/offers/checks.py",
    "seller/offers/issuance.py",
    "seller/offers/ledger.py",
    "seller/offers/reading.py",
    "seller/ports.py",
    "seller/resources.py",
    "seller/seed.py",
    "seller/settings.py",
    "seller/sqlite_store.py",
    "buyer/__init__.py",
    "buyer/app.py",
    "buyer/cfbot.py",
    "buyer/credentials.py",
    "buyer/flow.py",
    "buyer/http.py",
    "buyer/plan.py",
    "buyer/refusal.py",
    "buyer/repository.py",
    "buyer/resources.py",
    "buyer/seller_client.py",
    "buyer/settings.py",
    "persistence/__init__.py",
    "persistence/evidence.py",
    "persistence/sqlite.py",
    "protocol/__init__.py",
    "protocol/attribution.py",
    "protocol/documents.py",
    "protocol/operations.py",
    "protocol/record.py",
    "protocol/status.py",
    "protocol/values.py",
    "shared/__init__.py",
    "shared/auth.py",
    "shared/control.py",
    "shared/handlers.py",
    "shared/keyring.py",
    "shared/lifespan.py",
    "shared/operator.py",
    "shared/settings.py",
    "shared/wba.py",
    "runner/__init__.py",
    "runner/settings.py",
    "tests/_tools.py",
    "tests/conftest.py",
    "tests/test_apps.py",
    "tests/factories.py",
    "tests/test_architecture.py",
    "tests/test_boundary.py",
    "tests/test_buyer_repository.py",
    "tests/test_guards_ast_grep.py",
    "tests/test_guards_import_contracts.py",
    "tests/test_guards_ruff_bans.py",
    "tests/test_guards_skips.py",
    "tests/test_http.py",
    "tests/test_offers.py",
    "tests/test_operations.py",
    "tests/test_record_rules.py",
    "tests/test_sdk.py",
    "tests/test_seller_store.py",
    "tests/test_settings.py",
    "tests/test_sqlite.py",
]

# Out-of-scope demo modules: analyzed when an in-scope module imports them,
# silent otherwise. The entry goes when the scope covers every package (Step 8).
[[tool.mypy.overrides]]
module = ["seller.*", "buyer.*", "shared.*", "runner.*", "persistence.*"]
follow_imports = "silent"

# No explicit Any: the tier grows with each step until it covers every module (Step 8).
[[tool.mypy.overrides]]
module = [
    "seller.app",
    "seller.boundary",
    "seller.caller",
    "seller.errors",
    "seller.faults",
    "seller.http",
    "seller.offers.*",
    "seller.ports",
    "seller.resources",
    "seller.seed",
    "seller.settings",
    "seller.sqlite_store",
    "buyer.*",
    "persistence.*",
    "protocol.*",
    "runner.settings",
    "shared.auth",
    "shared.control",
    "shared.handlers",
    "shared.keyring",
    "shared.lifespan",
    "shared.operator",
    "shared.settings",
    "shared.wba",
    "tests._tools",
    "tests.conftest",
    "tests.test_apps",
    "tests.factories",
    "tests.test_architecture",
    "tests.test_boundary",
    "tests.test_buyer_repository",
    "tests.test_guards_ast_grep",
    "tests.test_guards_import_contracts",
    "tests.test_guards_ruff_bans",
    "tests.test_guards_skips",
    "tests.test_http",
    "tests.test_offers",
    "tests.test_operations",
    "tests.test_record_rules",
    "tests.test_sdk",
    "tests.test_seller_store",
    "tests.test_settings",
    "tests.test_sqlite",
]
disallow_any_explicit = true

[tool.coverage.run]
source = ["protocol", "persistence", "seller", "buyer", "shared", "runner"]
branch = true

[tool.coverage.report]
# The branch coverage measured on the tree before Step 0 (45.26), raised to each
# step's measured total (Step 1: 50.90; Step 2: 77.57; Step 3: 79.98; Step 4: 84.78;
# Step 5: 88.07; the refusal body and the library at f1f4092: 88.40; Step 6: 91.58).
# It is never lowered.
fail_under = 91.58
precision = 2
show_missing = false
