[project]
name = "openproposal-web-bot-auth"
version = "0.1.0"
description = "Demo: bearer tokens and Web Bot Auth signatures as credentials at one identity boundary, in front of OpenProposal offer acceptance"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # The Web Bot Auth module: signing, verification, the key directory, fetches.
    "iab-agentic-primitives[wba]",
    # The generated OpenProposal types.
    "openproposal-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    # RFC 8785 canonical JSON, the record_digest input (OpenProposal § 4.1.1).
    "rfc8785>=0.1.4",
    # The Public Suffix List, read offline, for the attribution rule (§ 4.1.2).
    "tldextract>=5.1",
    "idna>=3.7,<4",
    # The YAML parser; protocol/documents.py applies the YAML 1.2 core schema § 4.1.1 names.
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ast-grep-cli>=0.39",
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.4",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
# A path dependency on the library checkout next to this repository. The same
# relative layout holds inside the Docker build (see Dockerfile and the wba-lib
# additional context in e2e/docker-compose.yml).
iab-agentic-primitives = { path = "../iab-agentic-primitives", editable = true }
openproposal-sdk = { path = "vendor/openproposal-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "persistence", "shared", "transport", "seller", "buyer", "runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the shared harness as tests.stack.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "C4", "UP", "C90", "PLR", "SIM", "RET", "PTH", "TRY",
    "ARG", "ANN", "S", "TID", "RUF100",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openproposal._runtime".msg = "Import the SDK's public names from openproposal."

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Stated non-defects, not exemptions: a test asserts with `assert` (S101), and
# compares against the literal values the specification and the scenario name
# (PLR2004). Every other rule holds in tests too, annotations included.
"tests/**" = ["S101", "PLR2004"]
"e2e/scenarios/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# No explicit Any anywhere: JSON is protocol.values.JsonValue, and every value is typed.
disallow_any_explicit = true
# Every package, the unit tests, and the e2e scenarios. tests/ has no __init__.py, so
# its modules are named from the repository root; the scenarios import their
# conftest and settings by bare name, as pytest runs them, so e2e/scenarios is on
# the path.
explicit_package_bases = true
mypy_path = ["e2e/scenarios"]
files = [
    "protocol",
    "persistence",
    "shared",
    "transport",
    "seller",
    "buyer",
    "runner",
    "tests",
    "deploy/local_caddy.py",
    "e2e/gen_demo_tls.py",
    "e2e/scenarios",
]

# Storage reads rows by name into typed records (persistence/sqlite.py), so no
# expression there is Any: a row's values reach a record only through validation.
[[tool.mypy.overrides]]
module = ["persistence.*", "seller.sqlite_store", "buyer.repository"]
disallow_any_expr = true

[tool.coverage.run]
source = ["protocol", "persistence", "seller", "buyer", "shared", "transport", "runner"]
branch = true

[tool.coverage.report]
# The branch coverage measured on the tree before Step 0 (45.26), raised to each
# step's measured total (Step 1: 50.90; Step 2: 77.57; Step 3: 79.98; Step 4: 84.78;
# Step 5: 88.07; the refusal body and the library at f1f4092: 88.40; Step 6: 91.58;
# Step 7: 96.96; Step 8: 97.32, on the behavior suite; the foreign-origin, exact-line,
# digest, and runner corruption rows: 97.52; the pure values and the number domain: 97.58;
# next states built by constructor: 97.61; provenance and the one evidence store: 97.62;
# one schema owner per party, with rows read by name: 97.72; each party's own identity,
# keys, and operator key, and one composition pattern: 97.74; total HTTP seams, typed
# control operations and contracts, and closed report sets: 97.84). It is never lowered.
fail_under = 97.84
precision = 2
show_missing = false
