# Layer ban: canonical JSON and SHA-256 come from protocol/ only.
#
# Both parties must compute the same digest from the same bytes, so there is one
# canonicalizer and one hasher: protocol.values.canonical and protocol.record (digest_of,
# sha256_hex). A second one anywhere else could drift from it.
#
# Run as its own stage: `uv run ruff check --config ruff-digest.toml` (make lint).
# A separate config, so that no exemption here leaks into another ban.
extend-exclude = ["vendor"]

[lint]
select = ["TID251"]

[lint.per-file-ignores]
# The sanctioned canonicalizer and hasher.
"protocol/**" = ["TID251"]
# The e2e keeps its own digest oracle on purpose, independent of protocol/.
"e2e/scenarios/test_01_first_contact.py" = ["TID251"]

[lint.flake8-tidy-imports.banned-api]
"rfc8785".msg = "Canonical JSON comes from protocol.values.canonical."
"hashlib".msg = "Digests come from protocol.record (digest_of, sha256_hex)."
