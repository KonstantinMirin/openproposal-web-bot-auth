# The live deployment at https://wba-demo.noetis.dev. See deploy/README.md.
#
# The services are deploy/compose.base.yml's; this file adds what production
# needs: the secrets file, restarts, the ports the host's Caddy proxies to, the
# production timing, and the live runner on its schedule.
#
# The host's Caddy terminates TLS with Let's Encrypt certificates and proxies
# each agent's public name to a port on 127.0.0.1 (deploy/Caddyfile.snippet).
# Every container trusts the system's public roots only: no demo CA, no
# SSL_CERT_FILE, no NODE_EXTRA_CA_CERTS. An agent reaches another through public
# DNS and that Caddy, as any outside party does.
#
# Paths default to the host layout of deploy/README.md, relative to this file:
# ../../iab-agentic-primitives (the library checkout) and ../../run (the runner's
# reports, which Caddy serves). The secrets come from the file passed with
# `--env-file` (deploy/make-env.sh writes it): each agent gets its own operator
# key, and the runner the seller's and the buyer's.
name: wba-demo-live

x-live: &live
  image: wba-demo-python:live
  restart: unless-stopped

services:
  seller:
    extends: { file: compose.base.yml, service: seller }
    <<: *live
    ports: ["127.0.0.1:18081:8000"]
    environment:
      # Production values, stated: the directory's Cache-Control max-age, and how
      # long a cached buyer directory answers without a fetch (the library default).
      WBA_DIRECTORY_MAX_AGE: "300"
      WBA_MAX_CACHE_AGE: "300"

  buyer:
    extends: { file: compose.base.yml, service: buyer }
    <<: *live
    ports: ["127.0.0.1:18082:8000"]
    environment:
      WBA_MAX_CACHE_AGE: "300"
      # Production rotation: the directory's max-age 300 s, a wait of 600 s before a
      # published key signs (max-age 300 plus max_cache_age 300), signatures for 300 s.
      WBA_DIRECTORY_MAX_AGE: "300"
      WBA_ROTATION_WAIT: "600"
      WBA_SIGNATURE_LIFETIME: "300"

  cfbot:
    extends: { file: compose.base.yml, service: cfbot }
    image: wba-demo-cfbot:live
    restart: unless-stopped
    ports: ["127.0.0.1:18083:8000"]

  # The whole offer flow, live, every 15 minutes (runner/main.py). It writes
  # latest-run.json and history.json to the directory Caddy serves.
  runner:
    extends: { file: compose.base.yml, service: python }
    <<: *live
    profiles: !reset []
    command: ["python", "-m", "runner.main"]
    environment:
      PEER_SELLER_ORIGIN: https://seller.wba-demo.noetis.dev
      PEER_BUYER_ORIGIN: https://buyer.wba-demo.noetis.dev
      PEER_CFBOT_ORIGIN: https://cfbot.wba-demo.noetis.dev
      SELLER_CONTROL: http://seller:8000
      BUYER_CONTROL: http://buyer:8000
      SELLER_OPERATOR_KEY: ${SELLER_OPERATOR_KEY:?set in the secrets file}
      BUYER_OPERATOR_KEY: ${BUYER_OPERATOR_KEY:?set in the secrets file}
      DEMO_BEARER_TOKEN: ${DEMO_BEARER_TOKEN:?set in the secrets file}
      RUN_INTERVAL: ${RUN_INTERVAL:-900}
      OUT_DIR: /out
    volumes:
      # Read-only, and the database volumes only: the runner reports what each
      # party kept, and it mounts neither agent's keys volume.
      - seller-db:/seller-data:ro
      - buyer-db:/buyer-data:ro
      - ${WBA_RUN_DIR:-../../run}:/out
    depends_on:
      seller: { condition: service_healthy }
      buyer: { condition: service_healthy }
      cfbot: { condition: service_healthy }

networks:
  agents: {}

# Each agent's signing keys and its SQLite database, on separate volumes. They
# survive `down` and rebuilds; `down --volumes` deletes them, and the agents
# mint new keys on the next start.
volumes:
  seller-keys: {}
  seller-db: {}
  buyer-keys: {}
  buyer-db: {}
  cfbot-data: {}
