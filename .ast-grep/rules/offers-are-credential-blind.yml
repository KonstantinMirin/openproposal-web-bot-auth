# The offer logic is credential-blind: it takes the caller's principal id and
# an opaque Provenance, never how the caller authenticated, and never a header.
# It hands the provenance to storage unread. ruff-domain.toml bans importing the
# identity types (seller.caller) here, so no credential reaches it.
id: offers-are-credential-blind
language: Python
severity: error
message: The offer logic reads no credential and no header; only the principal decides.
files: ["seller/offers/**/*.py"]
rule:
  any:
    - pattern: $C.credential
    - pattern: $C.headers
