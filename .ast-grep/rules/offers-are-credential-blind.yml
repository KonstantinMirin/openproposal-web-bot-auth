# The offer logic is credential-blind: it reads the caller's principal, never
# how the caller authenticated, and never a header. It hands the caller to
# storage, which keeps the credential with the entry.
id: offers-are-credential-blind
language: Python
severity: error
message: The offer logic reads no credential and no header; only the principal decides.
files: ["seller/offers/**/*.py"]
rule:
  any:
    - pattern: $C.credential
    - pattern: $C.headers
