# The offer logic is credential-blind: it takes the caller's principal id, and
# an EntryWriter that the HTTP seam (seller/http.py) binds to the caller's
# provenance, never how the caller authenticated, and never a header.
# ruff-domain.toml bans importing the identity types (seller.caller) and the
# Provenance here, so no credential reaches it.
id: offers-are-credential-blind
language: Python
severity: error
message: The offer logic reads no credential and no header; only the principal decides.
files: ["seller/offers/**/*.py"]
rule:
  any:
    - pattern: $C.credential
    - pattern: $C.headers
