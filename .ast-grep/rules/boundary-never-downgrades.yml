# A presented credential that fails is refused, never downgraded to no
# credential: every except clause in the boundary raises.
id: boundary-never-downgrades
language: Python
severity: error
message: In the identity boundary, every except clause raises; a failing credential is refused, never downgraded.
files: ["seller/identity.py"]
rule:
  kind: except_clause
  not:
    has:
      kind: raise_statement
      stopBy: end
