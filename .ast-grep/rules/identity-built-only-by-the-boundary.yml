# The identity values (seller/caller.py) are built in one place: the boundary
# that confirmed the credential. One test module, tests/factories.py, builds them
# for the tests. A credential, a ResolvedCaller, or a PublicCaller built anywhere
# else is an identity nobody confirmed, and so is one rebuilt from another's
# fields with one of them changed. A Principal is not among them: it is the
# store's record of a party (seller/ports.py), which the store builds from its
# row and the boundary hands on unchanged.
id: identity-built-only-by-the-boundary
language: Python
severity: error
message: The identity types are built only by the identity boundary (seller/boundary.py) and the test factory (tests/factories.py).
files: ["seller/**/*.py", "buyer/**/*.py", "shared/**/*.py", "runner/**/*.py", "tests/**/*.py", "e2e/**/*.py"]
ignores: ["seller/boundary.py", "tests/factories.py"]
rule:
  any:
    - pattern: SignatureCredential($$$A)
    - pattern: BearerCredential($$$A)
    - pattern: ResolvedCaller($$$A)
    - pattern: PublicCaller($$$A)
    - pattern: $M.SignatureCredential($$$A)
    - pattern: $M.BearerCredential($$$A)
    - pattern: $M.ResolvedCaller($$$A)
    - pattern: $M.PublicCaller($$$A)
    - pattern: SignatureCredential.model_validate($$$A)
    - pattern: BearerCredential.model_validate($$$A)
    - pattern: ResolvedCaller.model_validate($$$A)
    - pattern: PublicCaller.model_validate($$$A)
    - pattern: SignatureCredential.model_validate_json($$$A)
    - pattern: BearerCredential.model_validate_json($$$A)
    - pattern: ResolvedCaller.model_validate_json($$$A)
    - pattern: PublicCaller.model_validate_json($$$A)
    - pattern: SignatureCredential.model_validate_strings($$$A)
    - pattern: BearerCredential.model_validate_strings($$$A)
    - pattern: ResolvedCaller.model_validate_strings($$$A)
    - pattern: PublicCaller.model_validate_strings($$$A)
    - pattern: type($V).model_validate($$$A)
    - pattern: type($V).model_validate_json($$$A)
    - pattern: $V.__class__.model_validate($$$A)
    - pattern: $V.__class__.model_validate_json($$$A)
    - pattern: $T.model_construct($$$A)
