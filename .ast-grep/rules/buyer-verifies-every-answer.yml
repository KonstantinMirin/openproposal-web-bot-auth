# The buyer verifies every seller answer and its binding: each WebBotAuth it
# builds names the origin it expects (expect=). The one sign-only peer is cfbot, through
# call_signed. Step 6 repoints the exemption to the Cfbot peer.
id: buyer-verifies-every-answer
language: Python
severity: error
message: Every WebBotAuth the buyer builds verifies the answer against the origin it expects (expect=); only call_signed (cfbot) signs without verifying.
files: ["buyer/**/*.py"]
rule:
  all:
    - pattern: WebBotAuth($$$A)
    - not:
        has:
          kind: argument_list
          has:
            kind: keyword_argument
            regex: '^expect='
    - not:
        inside:
          kind: function_definition
          regex: '^async def call_signed'
          stopBy: end
