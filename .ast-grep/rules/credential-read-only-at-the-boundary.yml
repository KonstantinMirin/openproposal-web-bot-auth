# Only the boundary reads a caller's protocol credential. Three files are
# exempt, each for its reason:
# - seller/identity.py is the boundary.
# - seller/faults.py is the test-only fault middleware: it re-signs a response
#   against a request it rewrites, so it reads the request's signature fields.
# - shared/operator.py is the operator control plane: X-Operator-Key guards an
#   agent's own controls, outside the identity boundary.
id: credential-read-only-at-the-boundary
language: Python
severity: error
message: Only seller/identity.py reads request headers or names a credential header.
files: ["seller/**/*.py", "shared/**/*.py"]
ignores: ["seller/identity.py", "seller/faults.py", "shared/operator.py"]
rule:
  any:
    - pattern: request.headers
    - pattern: $X.request.headers
    - pattern: scope["headers"]
    - pattern: Header($$$A)
    - kind: string
      regex: '(?i)^b?["''](authorization|signature|signature-input|signature-agent|x-operator-key)["'']$'
