# Only the boundary reads a caller's protocol credential. Five files are
# exempt, each for its reason:
# - seller/boundary.py is the boundary.
# - transport/wba.py is the one header codec: it turns a request's field lines
#   into the value the boundary verifies, and decides nothing.
# - seller/faults.py is the test-only fault middleware: it re-signs a response
#   against a request it rewrites, so it reads the request's signature fields.
# - transport/operator.py is the operator control plane: X-Operator-Key guards an
#   agent's own controls, outside the identity boundary.
# - transport/control.py names that header once, for the agents and the runner; it
#   reads nothing.
id: credential-read-only-at-the-boundary
language: Python
severity: error
message: Only seller/boundary.py reads request headers or names a credential header.
files: ["seller/**/*.py", "shared/**/*.py", "transport/**/*.py"]
ignores:
  - "seller/boundary.py"
  - "transport/wba.py"
  - "seller/faults.py"
  - "transport/operator.py"
  - "transport/control.py"
rule:
  any:
    - pattern: request.headers
    - pattern: $X.request.headers
    - pattern: scope["headers"]
    - pattern: Header($$$A)
    - kind: string
      regex: '(?i)^b?["''](authorization|signature|signature-input|signature-agent|x-operator-key)["'']$'
