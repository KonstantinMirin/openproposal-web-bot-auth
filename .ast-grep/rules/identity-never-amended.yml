# A resolved caller is frozen. model_copy(update=...) builds an amended copy
# without validation, so nothing in the seller calls it on the identity.
id: identity-never-amended
language: Python
severity: error
message: Nothing amends the caller after the boundary resolved it; model_copy builds an unvalidated copy.
files: ["seller/**/*.py"]
rule:
  any:
    - pattern: caller.model_copy($$$A)
    - pattern: $X.principal.model_copy($$$A)
    - pattern: $X.credential.model_copy($$$A)
