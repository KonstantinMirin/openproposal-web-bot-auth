# The proposal the seller issues to each buyer. On issue (seller/offers/issuance.py),
# the seller fills in proposal_id, seller (its own origin's host and legal name, from
# its settings), buyer, and eligible_buyers.
#
# Adapted from examples/proposal-issued.yaml in the OpenProposal 3.0 text (§ 6.12):
# - the seller is whichever seller issues it;
# - both line items are `published` at version 1, with no assent[], buyer writes,
#   deliveries, hold, change requests, or external references yet;
# - dates move forward so the offer still holds when you run the demo.
proposal_id:       "PLACEHOLDER"
version:           1
spec_version:      "3.0"
buyer:             { domain: "PLACEHOLDER", legal_name: "PLACEHOLDER" }
type:              standard
status:            published
offer_window:      { start: "2026-10-01T00:00:00Z", end: "2029-12-31T23:59:59Z" }

description: >
  Display and CTV line items, issued from the Q4 omnichannel proposal.

negotiation_history:
  - { version: 1, actor: seller, action: published, paths: [],
      at: "2026-10-04T09:00:00Z" }

line_items:
  - line_item_id:   "business-daily-display"
    status:         published
    channel:        display
    properties:
      available:    [{ id: "business-daily", domains: ["business-daily.example"],
                       child_audience: general, seller_relationship: owner,
                       seller_accounts: [{ asi: "ssp-a.example", sid: "pub-1001" }] }]
      included:     ["business-daily"]
    buyer_supplied:
      suppression_allowed: true
    accepted_exclusions:
      types:
        domains:  { enforcement: pre_serve, max_entries: 5000 }
        keywords: { enforcement: best_effort, max_entries: 500 }
    formats:
      available:    ["display/300x250", "display/970x250"]
      included:     ["display/300x250"]
      deltas:       { "display/970x250": { delta_cpm: 3.00 } }
    format_specs:
      "display/300x250":
        spec_ref: "registry.example/display/300x250@1"
        spec:         { w: 300, h: 250 }
      "display/970x250":
        spec_ref: "registry.example/display/970x250@1"
        spec:         { w: 970, h: 250 }
    creative_delivery: { method: buyer_hosted, other_protocols: [javascript_tag], secure_required: true }
    geo:
      allowed:      ["US"]
      default:      { include: ["US"] }
    frequency_cap:  { count: { min: 1, max: 5, default: 3 }, period: day, per: device }
    time_zone:      "America/New_York"
    pricing:
      - { pricing_id: "bd-cpm-usd", cost_method: CPM, list_rate: 24.00,
          price_valid_until: "2029-11-15T23:59:59Z", currency: USD, price_type: 3 }
      - { pricing_id: "bd-cpm-eur", cost_method: CPM, list_rate: 22.00,
          price_valid_until: "2029-11-15T23:59:59Z", currency: EUR, price_type: 3 }
    commitment_bounds: { spend: { min: 10000.00, max: 500000.00 } }
    cancellation_policy:
      available:
        - { id: "notice-14d", notice_duration: "P14D", max_share: 1, fees: [{ calculation: none }] }
        - { id: "notice-7d", notice_duration: "P7D", max_share: 1, fees: [{ calculation: none }] }
      included:     ["notice-14d"]
      deltas:       { "notice-7d": { delta_fraction: 0.02 } }
      max_select:   1
    controlling_measurement:
      available:    [{ id: seller-count, counted_by: seller,
                       discrepancy_threshold: 0.10, final_after: "P10D" }]
      included:     ["seller-count"]
      max_select:   1
    hold_terms:     { available: true, duration: "P7D" }
    transaction_mechanism:
      available:  [{ id: programmatic_guaranteed, delivery_type: guaranteed }]
      included:   ["programmatic_guaranteed"]
      max_select: 1
    deal_origin:   "adserver.example"
    buyer_requirements:
      seats_expected: true
      allowed_dsps:  ["dsp-a.example", "dsp-b.example"]
    visibility:    named
    eligible_buyers: ["PLACEHOLDER"]

  - line_item_id:   "weather-app-ctv"
    status:         published
    channel:        ctv
    properties:
      available:    [{ id: "weather-app",
                       apps: [{ store: roku_channel_store, bundle: "000000",
                                developer_domain: "weather-app.example" }],
                       child_audience: general, seller_relationship: owner,
                       seller_accounts: [{ asi: "ssp-a.example", sid: "pub-1001" }] }]
      included:     ["weather-app"]
    placement:      { plcmt: 1 }
    formats:
      available:    ["ctv/instream-15s"]
      included:     ["ctv/instream-15s"]
    format_specs:
      "ctv/instream-15s":
        spec_ref: "registry.example/ctv/instream-15s@1"
        spec:
          duration:    { nominal_s: 15, tolerance_ms: 500 }
          source:      vast_mezzanine
          mezzanine:   { required_for: [ssai], min_resolution: "1920x1080" }
          loudness:    { standard: atsc_a85, target: -24, tolerance_db: 2 }
          creative_id: { universal_ad_id: required }
    creative_delivery: { method: seller_hosted, protocols: [13], secure_required: true }
    materials_due:  { at: "2029-10-20T23:59:59Z" }
    pricing:
      - { pricing_id: "ctv-pg-cpm-usd", cost_method: CPM, list_rate: 45.00,
          price_valid_until: "2029-12-01T23:59:59Z", currency: USD, price_type: 3 }
    commitment_bounds: { spend: { min: 25000.00 } }
    controlling_measurement:
      available:    [{ id: seller-count, counted_by: seller,
                       discrepancy_threshold: 0.10, final_after: "P10D" }]
      included:     ["seller-count"]
      max_select:   1
    hold_terms:     { available: true, duration: "P14D" }
    transaction_mechanism:
      available:  [{ id: programmatic_guaranteed, delivery_type: guaranteed }]
      included:   ["programmatic_guaranteed"]
      max_select: 1
    deal_origin:   "ssp-a.example"
    visibility:    named
    eligible_buyers: ["PLACEHOLDER"]
